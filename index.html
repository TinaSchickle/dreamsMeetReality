<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreams Meet Reality</title>
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #0b0d0a;
    overflow: hidden;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    height: 100vh;
    width: 100vw;
  }
  .gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @media (max-width: 900px) {
    .gallery {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(3, 1fr);
    }
  }
</style>
</head>
<body>
  <div class="gallery">
    <img src="assets/photo1.jpg" alt="Tiny Houses im Bambusgarten">
    <img src="assets/photo2.jpg" alt="Feuerstelle mit Sauna und Loungebereich">
    <img src="assets/photo3.jpg" alt="Feuerstelle mit Picknicktischen zwischen den Tiny Houses">
  </div>
</body>
</html>
