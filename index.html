<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreams Meet Reality</title>
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #05060a;
    overflow: hidden;
  }
  .collage {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    height: 100vh;
    width: 100vw;
    padding: 6px;
  }
  .collage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.08) contrast(1.03);
  }
  .main {
    grid-row: 1 / 3;
    grid-column: 1;
    border-radius: 14px 4px 4px 14px;
  }
  .top-right {
    grid-row: 1;
    grid-column: 2;
    border-radius: 4px 14px 4px 4px;
  }
  .bottom-right {
    grid-row: 2;
    grid-column: 2;
    border-radius: 4px 4px 14px 4px;
  }
  @media (max-width: 900px) {
    .collage {
      grid-template-columns: 1fr;
      grid-template-rows: 1.4fr 1fr 1fr;
    }
    .main {
      grid-row: 1;
      grid-column: 1;
      border-radius: 14px 14px 4px 4px;
    }
    .top-right {
      grid-row: 2;
      grid-column: 1;
      border-radius: 4px;
    }
    .bottom-right {
      grid-row: 3;
      grid-column: 1;
      border-radius: 4px 4px 14px 14px;
    }
  }
</style>
</head>
<body>
  <div class="collage">
    <img class="main" src="assets/photo1.jpg" alt="Tiny Houses im Bambusgarten">
    <img class="top-right" src="assets/photo3.jpg" alt="Feuerstelle mit Picknicktischen zwischen den Tiny Houses">
    <img class="bottom-right" src="assets/photo2.jpg" alt="Feuerstelle mit Sauna und Loungebereich">
  </div>
</body>
</html>
