<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreams Meet Reality</title>
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0b0d0a;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 3rem 1.5rem;
  }
  h1 {
    color: #f2f0ea;
    font-weight: 500;
    letter-spacing: 0.02em;
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    margin: 0;
    text-align: center;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
    width: 100%;
    max-width: 1400px;
  }
  .gallery img {
    width: 100%;
    height: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: block;
  }
  @media (max-width: 900px) {
    .gallery {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <h1>Dreams Meet Reality</h1>
    <div class="gallery">
      <img src="assets/photo1.jpg" alt="Tiny Houses im Bambusgarten">
      <img src="assets/photo2.jpg" alt="Feuerstelle mit Sauna und Loungebereich">
      <img src="assets/photo3.jpg" alt="Feuerstelle mit Picknicktischen zwischen den Tiny Houses">
    </div>
  </div>
</body>
</html>
