<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreams Meet Reality</title>
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .frame {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .fallback {
    color: #888;
    font-family: system-ui, sans-serif;
    font-size: 1rem;
    text-align: center;
    padding: 1rem;
  }
</style>
</head>
<body>
  <div class="frame">
    <img src="assets/photo.jpg" alt="Dreams Meet Reality"
         onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fallback', textContent:'Bild fehlt: assets/photo.jpg'}))">
  </div>
</body>
</html>
